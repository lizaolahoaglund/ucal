; Copy outside the source tree, edit, and save as UTF-16 LE.
; Set UCAL_J2534_CONFIG to that file's absolute path before starting the Broker.
; Generic runtime/selectors below are examples, not qualification.
; Manager uses concrete backend.json packages; this INI is for standalone tools.
[provider]
profile=04.04-gmw17753-raw-iso-fd
id=qualified-provider
runtime=C:\Vendor\Runtime\StandardJ2534.dll
endpoint_count=1
pins=1550
; A fixed timing profile requires the actual sampling pair, DLL version and
; SHA-256 for the selected runtime/configuration. Use driver query profiles
; below when supported. A fixed profile does not imply configurable sampling.
; fixed_fd_nominal_sample_point=75
; fixed_fd_data_sample_point=80
; fixed_fd_nominal_bitrate=500000
; fixed_fd_data_bitrate=8000000
; fixed_timing_dll_version=1.0.0.1
; fixed_timing_sha256=<64 lowercase hex characters from the qualified DLL>
; worker_path=C:\UCAL\runtime\x86\UcalBroker.exe

[endpoint.0]
selector=vendor-explicit-device-selector:0
adapter_identity=persistent-adapter-identity
physical_port=0
name=Qualified CAN FD port 1
model=Qualified adapter
serial=
brs=1
termination=1
